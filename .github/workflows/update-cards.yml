name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 6am UTC (2am Eastern)
  workflow_dispatch:       # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ranger-Jay&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Ranger-Jay&layout=compact&langs_count=6&theme=tokyonight&hide_border=true&hide=mako,shell,dockerfile,procfile
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate streak card
        shell: bash
        env:
          URL: "https://streak-stats.demolab.com/?user=Ranger-Jay&theme=tokyonight&hide_border=true"
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -sSfL --max-time 60 "$URL" -o streak.tmp \
               && grep -q "Total Contributions" streak.tmp; then
              mv streak.tmp profile/streak.svg; ok=1; break
            fi
            echo "Attempt $i failed; retrying in 20s"
            sleep 20
          done
          rm -f streak.tmp
          [ "$ok" = 1 ] || echo "Streak service down; keeping previous card."
          
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
